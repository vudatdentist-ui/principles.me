services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: principles_preview
      POSTGRES_PASSWORD: ${PREVIEW_DB_PASSWORD:?PREVIEW_DB_PASSWORD is required}
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d principles_preview"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - preview-postgres:/var/lib/postgresql/data
    networks:
      - preview

  principles:
    image: ${PRINCIPLES_IMAGE:?PRINCIPLES_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${PRINCIPLES_ENV_FILE:?PRINCIPLES_ENV_FILE is required}
    environment:
      APP_ENV: staging
      APP_VERSION: ${PRINCIPLES_IMAGE_TAG:?PRINCIPLES_IMAGE_TAG is required}
      INTERNAL_AUTH_REQUIRED: "true"
      POSTGRES_URL: postgresql://postgres:${PREVIEW_DB_PASSWORD}@postgres:5432/principles_preview
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - preview
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.${TRAEFIK_ROUTER:?TRAEFIK_ROUTER is required}.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER}.rule=Host(`${PRINCIPLES_HOST:?PRINCIPLES_HOST is required}`)
      - traefik.http.routers.${TRAEFIK_ROUTER}.tls=true
      - traefik.http.routers.${TRAEFIK_ROUTER}.tls.certresolver=letsencrypt
      - traefik.http.routers.${TRAEFIK_ROUTER}.service=${TRAEFIK_ROUTER}
      - traefik.http.services.${TRAEFIK_ROUTER}.loadbalancer.server.port=3000

volumes:
  preview-postgres:

networks:
  preview:
  coolify:
    external: true
