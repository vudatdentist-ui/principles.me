name: M7 Static Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/milestone-7-trust-layer'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-7-trust-layer
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply safe formatter fixes
        run: pnpm fix || true
      - name: Apply intentional lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/decision-workspace.tsx')
          text = path.read_text()
          text = text.replace('        // biome-ignore lint/performance/noAwaitInLoops: NDJSON stream must be consumed sequentially.\n', '')
          path.write_text(text)

          path = Path('app/api/council/route.ts')
          text = path.read_text().replace('        grounded = result.grounded;\n', '        ({ grounded } = result);\n')
          path.write_text(text)

          path = Path('scripts/run-council-live-evals.ts')
          text = path.read_text()
          text = text.replace(
              'for (const evalCase of cases) {\n  const response = await fetch',
              'for (const evalCase of cases) {\n  // biome-ignore lint/performance/noAwaitInLoops: Live evals intentionally run sequentially to preserve auth cookie state and avoid bursting model traffic.\n  const response = await fetch',
          )
          text = text.replace(
              '    cookie = setCookie.split(";", 1)[0];',
              '    const [nextCookie] = setCookie.split(";", 1);\n    cookie = nextCookie;',
          )
          text = text.replace(
              'Object.entries(scored) as Array<\n    [LiveMetric, number]\n  >',
              'Object.entries(scored) as [LiveMetric, number][]',
          )
          text = text.replace(
              '} catch {\n    throw new Error(\n      "Live baseline not found. Capture one with EVAL_UPDATE_BASELINE=1 pnpm eval:council:live."\n    );\n  }',
              '} catch (error) {\n    throw new Error(\n      "Live baseline not found. Capture one with EVAL_UPDATE_BASELINE=1 pnpm eval:council:live.",\n      { cause: error }\n    );\n  }',
          )
          path.write_text(text)
          PY
          pnpm fix || true
          pnpm check
      - name: Commit clean static state and remove one-shot workflow
        run: |
          rm .github/workflows/m7-static-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix M7 static checks"
          git push origin HEAD:agent/milestone-7-trust-layer
