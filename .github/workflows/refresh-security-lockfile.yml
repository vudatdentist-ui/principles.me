name: Refresh security lockfile

on:
  push:
    branches:
      - hardening/product-learning-observability-security

permissions:
  contents: write

concurrency:
  group: refresh-security-lockfile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/product-learning-observability-security
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Upgrade Next.js to current security release
        run: pnpm add next@16.3.3 --save-exact --lockfile-only
      - name: Commit refreshed manifest and lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "LOCKFILE_ALREADY_CURRENT=1"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "Upgrade Next.js to 16.3.3 security release"
          git push origin HEAD:hardening/product-learning-observability-security
