name: M4 async form fix

on:
  pull_request:
    branches: [main]

jobs:
  patch-forms:
    if: github.head_ref == 'agent/milestone-4-judgment-loop'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch async form element lifetime
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/judgment-decision.tsx")
          text = path.read_text()

          judgment_old = '''      event.preventDefault();
                setSaving(true);
                setError("");
                const form = new FormData(event.currentTarget);'''
          judgment_new = '''      event.preventDefault();
                const formElement = event.currentTarget;
                setSaving(true);
                setError("");
                const form = new FormData(formElement);'''

          simple_old = '''      event.preventDefault();
                const form = new FormData(event.currentTarget);
                setSaving(true);'''
          simple_new = '''      event.preventDefault();
                const formElement = event.currentTarget;
                const form = new FormData(formElement);
                setSaving(true);'''

          if text.count(judgment_old) != 1:
              raise SystemExit(f"Expected 1 judgment pattern, found {text.count(judgment_old)}")
          if text.count(simple_old) != 2:
              raise SystemExit(f"Expected 2 simple form patterns, found {text.count(simple_old)}")
          if text.count("event.currentTarget.reset();") != 3:
              raise SystemExit("Expected exactly 3 post-await form resets")

          text = text.replace(judgment_old, judgment_new, 1)
          text = text.replace(simple_old, simple_new)
          text = text.replace("event.currentTarget.reset();", "formElement.reset();")
          path.write_text(text)
          PY
      - name: Commit form fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/judgment-decision.tsx
          git diff --cached --quiet && exit 1
          git commit -m "Fix async judgment form refresh"
          git push origin HEAD:${{ github.head_ref }}
