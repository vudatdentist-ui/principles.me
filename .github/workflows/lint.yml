name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, linux, x64, principles-ci]
    strategy:
      max-parallel: 1
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Validate production deploy shell
        run: bash -n scripts/deploy-production-v2.sh
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: >-
          pnpm exec biome lint
          app/api
          app/v2
          app/(primary)
          app/globals.css
          app/layout.tsx
          components/brain-scene.tsx
          components/principles-council.tsx
          features/decision
          features/evidence
          features/shared
          lib/principles-graph.ts
          scripts/ensure-v2-production-schema.mjs
          scripts/verify-db-migrations.mjs
          scripts/verify-v2-contracts.ts
