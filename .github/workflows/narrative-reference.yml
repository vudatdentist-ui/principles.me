name: Narrative reference snapshot
on:
  push:
    branches: [ops/narrative-reference-20260923]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be9d3a2634acf1b36fe63bd21e9db5f486f43a0d
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Inspect chapter controls and public home
        run: |
          mkdir -p inspection
          cat > reference.cjs <<'JS'
          const { chromium } = require('@playwright/test');
          const fs = require('node:fs/promises');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, reducedMotion: 'reduce' });
            const capture = async (name) => {
              await page.evaluate(() => document.fonts.ready);
              await page.waitForTimeout(700);
              await page.screenshot({ path: `inspection/${name}.png`, fullPage: true });
              await fs.writeFile(`inspection/${name}.txt`, await page.locator('body').innerText());
              await fs.writeFile(`inspection/${name}.html`, await page.content());
            };
            try {
              await page.goto('https://learn.w4gz.com/', { waitUntil: 'networkidle', timeout: 60000 });
              const intro = page.locator('.line-intro__header button');
              if (await intro.isVisible()) await intro.click();
              await page.waitForTimeout(800);
              for (let i=0; i<3; i++) {
                const button = page.locator('.welcome-journey__chapters button').nth(i);
                if (await button.isVisible()) { await button.click(); await capture(`chapter-${i+1}`); }
              }
              const skip = page.locator('.welcome-journey__skip');
              if (await skip.isVisible()) await skip.click();
              await page.waitForTimeout(1000);
              const cookies = page.getByRole('button', { name: /Chỉ thiết yếu/i });
              if (await cookies.isVisible()) await cookies.click();
              await capture('reference-home');
              await fs.writeFile('inspection/reference-links.json', JSON.stringify(await page.locator('a').evaluateAll(links=>links.map(a=>({text:a.textContent,href:a.href}))), null, 2));
            } catch (error) { await fs.writeFile('inspection/reference-error.txt', String(error)); await capture('reference-error'); }
            await browser.close();
          })();
          JS
          node reference.cjs
      - name: Archive exact inspected baseline
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD --output=inspection/source.tgz
          tar -tzf inspection/source.tgz > inspection/source-manifest.txt
          grep -qx AGENTS.md inspection/source-manifest.txt
          grep -qx app/layout.tsx inspection/source-manifest.txt
          git rev-parse HEAD > inspection/source-sha.txt
          cd inspection
          sha256sum source.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: narrative-source-reference
          path: inspection/
          retention-days: 3
