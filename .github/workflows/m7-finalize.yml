name: M7 Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/milestone-7-trust-layer'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CI: true
      APP_ENV: test
      AUTH_SECRET: ci-only-auth-secret-not-for-production
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/principles_m7
      BLOB_READ_WRITE_TOKEN: ci-placeholder
      REDIS_URL: redis://localhost:6379
      RAGFLOW_BASE_URL: http://127.0.0.1:9399
      RAGFLOW_API_KEY: mock-ragflow-key
      RAGFLOW_DATASET_IDS: mock-dataset
      RAGFLOW_TOP_K: 6
      DEEPSEEK_BASE_URL: http://127.0.0.1:9399
      DEEPSEEK_API_KEY: mock-deepseek-key
      DEEPSEEK_MODEL: mock-deepseek
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: principles_m7
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d principles_m7"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Remember source head
        run: echo "M7_SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository formatter
        run: pnpm fix
      - name: Static check
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Verify Council contracts
        run: pnpm council:verify
      - name: Verify 50-case suite can pass before capture
        run: pnpm eval:council
      - name: Capture exact non-regressing baseline
        run: pnpm exec tsx scripts/capture-council-baseline.ts
      - name: Verify captured baseline and zero deltas
        run: pnpm eval:council
      - name: Verify telemetry allowlist
        run: pnpm telemetry:verify
      - name: Validate migration metadata
        run: pnpm db:check
      - name: Migrate fresh PostgreSQL database
        run: pnpm db:migrate
      - name: Verify migrated schema and cascades
        run: pnpm db:verify
      - name: Production build
        run: pnpm build
      - name: Build production Docker image
        run: docker build -t principles-m7:${{ github.sha }} .
      - name: Verify migrations from production image
        run: docker run --rm --network host -e POSTGRES_URL="$POSTGRES_URL" principles-m7:${{ github.sha }} pnpm db:migrate
      - name: Start deterministic Council providers
        run: |
          node scripts/mock-council-providers.mjs > /tmp/council-mock.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:9399/health >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/council-mock.log
          exit 1
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Run all product browser regressions
        run: pnpm test:e2e
      - name: Record validation and remove temporary writers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const baseline = JSON.parse(fs.readFileSync('evals/council/baseline.json', 'utf8'));
          const marker = {
            validatedSourceHead: process.env.M7_SOURCE_HEAD,
            validatedAt: new Date().toISOString(),
            councilEvalCases: baseline.caseCount,
            councilEvalScores: baseline.scores,
            browserCommand: 'pnpm test:e2e',
            retries: 0,
            quality: 'passed'
          };
          fs.writeFileSync('docs/m7-validation.json', JSON.stringify(marker, null, 2) + '\n');
          NODE
          git rm .github/workflows/m7-finalize.yml \
            .github/workflows/capture-trust-baseline.yml \
            .github/workflows/cleanup-trust-capture.yml \
            .github/workflows/m7-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Milestone 7 trust baseline"
          git push origin HEAD:${{ github.head_ref }}
