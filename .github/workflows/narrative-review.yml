name: Apply narrative browser review
on:
  push:
    branches: [refactor/narrative-evidence-20260923]
    paths: [.github/workflows/narrative-review.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and apply only the reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          base = '27b08e7d390cf442559871906b582a39403f0202'
          transport = {'.github/narrative-review.b64', '.github/workflows/narrative-review.yml'}
          before = set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())
          assert before == transport, f'Unexpected branch changes: {before}'
          patch = gzip.decompress(base64.b64decode(pathlib.Path('.github/narrative-review.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'dc1a7778013a52d29f7ca4209d74709076d6df4dad444fdce99b8e60c1bab96e', 'Checksum mismatch'
          expected = set('''docs/product/NARRATIVE_WORKSPACE.md
          features/evolution/evolution-workspace.tsx
          features/learning/learning-recenter.tsx
          features/organization/organization-recenter.tsx
          tests/e2e/learning-capture.spec.ts
          tests/e2e/narrative-records.spec.ts
          tests/e2e/nested-stage-layout.spec.ts
          tests/e2e/readability.spec.ts
          tests/e2e/smoke.spec.ts
          tests/e2e/ui-regression.spec.ts'''.splitlines())
          actual = {line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat','-'],input=patch).decode().splitlines()}
          assert actual == expected, f'Unexpected patch scope: {actual ^ expected}'
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm','--',*sorted(transport)],check=True)
          after = set(subprocess.check_output(['git','diff','--cached','--name-only',base]).decode().splitlines())
          assert after == expected, 'Final source scope changed'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Commit reviewed source and remove transfer scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): remove repeated context and verify actionable narrative scenes'
          git push origin HEAD:refs/heads/refactor/narrative-evidence-20260923
          git rev-parse HEAD
