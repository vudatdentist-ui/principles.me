name: Refresh Phase 1 lockfile

on:
  push:
    branches:
      - phase/1-secure-platform-durable-kernel
    paths:
      - package.json
      - .github/workflows/refresh-phase1-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: [self-hosted, linux, x64, principles-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/1-secure-platform-durable-kernel
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Phase 1: refresh pnpm lockfile"
          git push origin HEAD:phase/1-secure-platform-durable-kernel
