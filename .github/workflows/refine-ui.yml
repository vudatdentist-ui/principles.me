name: Materialize reviewed UI refinements
on:
  push:
    branches: [audit/ui-restructure-20260920]
    paths: [.github/workflows/refine-ui.yml]
permissions:
  contents: write
jobs:
  source-tree:
    if: github.repository == 'vudatdentist-ui/principles.me' && github.ref == 'refs/heads/audit/ui-restructure-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed source and create unreferenced Git tree only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          base='5069d318df7e0c480bf9372fa590761ba0c56367'
          raw=pathlib.Path('.audit-refinement').read_text().replace('qqKKKK7','qqKK7',1)
          packed=base64.b64decode(raw,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='85e150c555762d2cf164135948fd66e8698ac7c5d813cbf1ce33952a40a7bdbb'
          tree=[]
          hashes={}
          for item in json.loads(gzip.decompress(packed)):
              p=item['path']
              assert '..' not in pathlib.PurePosixPath(p).parts
              assert p.startswith('tests/e2e/') or p in ['features/evolution/evolution-workspace.tsx','features/organization/organization-recenter.tsx']
              before=subprocess.check_output(['git','show',base+':'+p]).decode()
              assert hashlib.sha256(before.encode()).hexdigest()==item['oldHash'],p
              assert subprocess.check_output(['git','show','HEAD:'+p]).decode()==before,p
              lines=before.splitlines(keepends=True)
              for a,b,text in reversed(item['edits']):lines[a:b]=[text]
              after=''.join(lines)
              assert hashlib.sha256(after.encode()).hexdigest()==item['hash'],p
              tree.append({'path':p,'mode':'100644','type':'blob','content':after})
              hashes[p]=item['hash']
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def api(path,data=None):
              request=urllib.request.Request(root+path,data=json.dumps(data).encode() if data is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
          parent=api('/git/commits/'+os.environ['GITHUB_SHA'])
          result=api('/git/trees',{'base_tree':parent['tree']['sha'],'tree':tree})
          pathlib.Path('refinement-receipt.json').write_text(json.dumps({'tree':result['sha'],'parent':os.environ['GITHUB_SHA'],'files':hashes},indent=2))
          print('VERIFIED_SOURCE_TREE='+result['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: refinement-receipt
          path: refinement-receipt.json
          retention-days: 1
