name: Apply narrative visual review
on:
  push:
    branches: [refactor/narrative-evidence-20260923]
    paths: [.github/workflows/narrative-visual.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and apply the exact visually reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          base = '2d7bdae21c8ffff819e790b0283d6824c2345160'
          transport = {'.github/narrative-visual.b64', '.github/workflows/narrative-visual.yml'}
          before = set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())
          assert before == transport, f'Unexpected branch changes: {before}'
          patch = gzip.decompress(base64.b64decode(pathlib.Path('.github/narrative-visual.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '34007bc42c3e73a92edc6e65eac50eca8b8b8c6dd64352c46d74b48187b1b853', 'Checksum mismatch'
          expected = set('''docs/product/NARRATIVE_WORKSPACE.md
          features/evolution/evolution-step-explorer.module.css
          features/evolution/evolution-workspace.tsx
          features/i18n/narrative-messages.ts
          features/learning/learning-recenter.module.css
          tests/e2e/narrative-records.spec.ts'''.splitlines())
          actual = {line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat','-'],input=patch).decode().splitlines()}
          assert actual == expected, f'Unexpected patch scope: {actual ^ expected}'
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm','--',*sorted(transport)],check=True)
          after = set(subprocess.check_output(['git','diff','--cached','--name-only',base]).decode().splitlines())
          assert after == expected, 'Final source scope changed'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Commit source and remove transfer scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): keep narrative steps readable and preserve return navigation'
          git push origin HEAD:refs/heads/refactor/narrative-evidence-20260923
          git rev-parse HEAD
