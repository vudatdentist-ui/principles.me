name: Cleanup Trust Baseline Capture

on:
  pull_request:
    branches: [main]

jobs:
  cleanup:
    if: github.head_ref == 'agent/milestone-7-trust-layer'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Remove writer only after a non-zero baseline exists
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const baseline = JSON.parse(fs.readFileSync('evals/council/baseline.json', 'utf8'));
          const values = Object.values(baseline.scores || {});
          if (!values.length || values.every((value) => Number(value) === 0)) {
            console.log('Baseline not captured yet; leaving writer in place.');
            process.exit(0);
          }
          fs.writeFileSync('/tmp/trust-baseline-ready', 'yes');
          NODE
          if [ ! -f /tmp/trust-baseline-ready ]; then
            exit 0
          fi
          git rm .github/workflows/capture-trust-baseline.yml .github/workflows/cleanup-trust-capture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Trust baseline capture workflows"
          git push origin HEAD:${{ github.head_ref }}
