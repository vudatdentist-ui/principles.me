name: Cortex Core

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  cortex-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cortex-core
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply canonical repo fixes
        run: |
          pnpm exec biome check --write --unsafe app/api/cortex lib/cortex lib/db/cortex-run-queries.ts scripts/verify-cortex-core.mts || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/api/cortex lib/cortex lib/db/cortex-run-queries.ts scripts/verify-cortex-core.mts
          if ! git diff --cached --quiet; then
            git commit -m "Apply Cortex lint fixes"
            git push origin HEAD:agent/cortex-core
          fi
      - name: Verify Cortex contract and trust invariants
        run: pnpm exec tsx scripts/verify-cortex-core.mts
      - name: Verify existing Council trust baseline
        run: pnpm exec tsx scripts/run-council-evals.ts
