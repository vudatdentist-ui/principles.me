name: Foundation CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  APP_ENV: test
  AUTH_SECRET: ci-only-auth-secret-not-for-production
  POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/principles_ci
  BLOB_READ_WRITE_TOKEN: ci-placeholder
  REDIS_URL: redis://localhost:6379

jobs:
  quality:
    name: Quality + fresh DB
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: principles_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d principles_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Static check
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Verify Council v1 contracts
        run: pnpm council:verify
      - name: Validate migration metadata
        run: pnpm db:check
      - name: Migrate fresh PostgreSQL database
        run: pnpm db:migrate
      - name: Verify migrated schema and cascades
        run: pnpm db:verify
      - name: Production build
        run: pnpm build
      - name: Build production Docker image
        run: docker build -t principles-ci .
      - name: Verify migrations from production image
        run: >-
          docker run --rm
          --add-host host.docker.internal:host-gateway
          -e POSTGRES_URL=postgresql://postgres:postgres@host.docker.internal:5432/principles_ci
          principles-ci pnpm db:migrate

  playwright:
    name: Playwright product smoke
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RAGFLOW_BASE_URL: http://127.0.0.1:9399
      RAGFLOW_API_KEY: mock-ragflow-key
      RAGFLOW_DATASET_IDS: mock-dataset
      RAGFLOW_TOP_K: "6"
      DEEPSEEK_BASE_URL: http://127.0.0.1:9399
      DEEPSEEK_API_KEY: mock-deepseek-key
      DEEPSEEK_MODEL: mock-deepseek
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: principles_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d principles_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start deterministic Council providers
        run: |
          node scripts/mock-council-providers.mjs > /tmp/council-mock.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:9399/health >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/council-mock.log
          exit 1
      - name: Migrate test database
        run: pnpm db:migrate
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      - name: Run Principles smoke tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
