name: M4 formatter fix

on:
  pull_request:
    branches: [main]

jobs:
  format-m4:
    if: github.head_ref == 'agent/milestone-4-judgment-loop'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Judgment workspace only
        run: pnpm exec biome format --write components/judgment-decision.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet -- components/judgment-decision.tsx; then
            echo "No formatter changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/judgment-decision.tsx
          git commit -m "Format judgment workspace"
          git push origin HEAD:${{ github.head_ref }}
