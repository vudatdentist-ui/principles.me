name: V2 Playwright

on:
  push:
    branches: [main, master]
    paths:
      - "app/v2/**"
      - "app/api/v2/decisions/**"
      - "features/decision/contracts.ts"
      - "features/decision/stream-events.ts"
      - "features/decision/transport/**"
      - "features/decision/ui/**"
      - "features/evidence/contracts.ts"
      - "features/shared/**"
      - "features/shell/**"
      - "features/ui-v2/**"
      - "styles/v2/**"
      - "tests/v2/**"
      - "playwright.config.ts"
      - ".github/workflows/playwright.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "app/v2/**"
      - "app/api/v2/decisions/**"
      - "features/decision/contracts.ts"
      - "features/decision/stream-events.ts"
      - "features/decision/transport/**"
      - "features/decision/ui/**"
      - "features/evidence/contracts.ts"
      - "features/shared/**"
      - "features/shell/**"
      - "features/ui-v2/**"
      - "styles/v2/**"
      - "tests/v2/**"
      - "playwright.config.ts"
      - ".github/workflows/playwright.yml"

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: v2-playwright-${{ github.ref }}

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint V2 test harness
        run: pnpm exec biome lint tests playwright.config.ts

      - name: Run deterministic harness tests
        run: pnpm exec tsx --test tests/v2/unit/*.test.ts

      - name: Run V2 smoke tests
        run: pnpm exec playwright test --project=v2-chromium

      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: v2-playwright-report
          path: playwright-report/
          retention-days: 7
