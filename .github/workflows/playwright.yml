name: Playwright

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: playwright-${{ github.head_ref || github.ref_name }}

jobs:
  test:
    runs-on: [self-hosted, linux, x64, principles-ci]
    env:
      APP_ORIGIN: http://127.0.0.1:3000
      AUTH_EMAIL_VERIFICATION_MODE: optional
      AUTH_SIGNUP_MODE: open
      DEEPSEEK_API_KEY: phase2-e2e-key
      DEEPSEEK_BASE_URL: http://127.0.0.1:4111
      POSTGRES_DB: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PASSWORD: principles_e2e
      POSTGRES_PORT: 55433
      POSTGRES_USER: principles
      RAGFLOW_ASSIGN_BOOTSTRAP_DATASETS: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start PostgreSQL 16
        run: bash scripts/ci-postgres.sh start
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Start deterministic DeepSeek fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/mock-deepseek.mjs > /tmp/principles-mock-deepseek.log 2>&1 &
          echo $! > /tmp/principles-mock-deepseek.pid
          sleep 1
          grep -q 'MOCK_DEEPSEEK_READY=1' /tmp/principles-mock-deepseek.log
      - name: Install Chromium browser
        run: pnpm exec playwright install chromium
      - name: Run browser smoke tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Stop deterministic DeepSeek fixture
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/principles-mock-deepseek.pid ]; then
            kill "$(cat /tmp/principles-mock-deepseek.pid)" 2>/dev/null || true
            rm -f /tmp/principles-mock-deepseek.pid
          fi
      - name: Stop PostgreSQL
        if: always()
        run: bash scripts/ci-postgres.sh stop
