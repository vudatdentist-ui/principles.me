name: M4 test contract fix

on:
  pull_request:
    branches: [main]

jobs:
  patch-contracts:
    if: github.head_ref == 'agent/milestone-4-judgment-loop'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch M4 semantic test contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path("components/judgment-decision.tsx")
          text = component.read_text()
          old = '''          <span
            className={`${styles.candidateStatus} ${styles[candidate.status]}`}
          >'''
          new = '''          <span
            className={`${styles.candidateStatus} ${styles[candidate.status]}`}
            data-testid="candidate-status"
          >'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one candidate status span, found {text.count(old)}")
          component.write_text(text.replace(old, new, 1))

          judgment_test = Path("tests/e2e/judgment-loop.test.ts")
          text = judgment_test.read_text()
          if text.count('await expect(candidate).toContainText("adopted");') != 1:
              raise SystemExit("Expected adopted assertion once")
          if text.count('await expect(candidate).toContainText("rejected");') != 1:
              raise SystemExit("Expected rejected assertion once")
          text = text.replace(
              'await expect(candidate).toContainText("adopted");',
              'await expect(page.getByTestId("candidate-status")).toHaveText("adopted");',
              1,
          )
          text = text.replace(
              'await expect(candidate).toContainText("rejected");',
              'await expect(page.getByTestId("candidate-status")).toHaveText("rejected");',
              1,
          )
          judgment_test.write_text(text)

          smoke = Path("tests/e2e/principles-smoke.test.ts")
          text = smoke.read_text()
          old = '''    await expect(
      page.getByText(
        "Do not normalize repeated avoidance of hard conversations."
      )
    ).toBeVisible();
  });
});'''
          new = '''    await expect(
      page
        .getByTestId("principle-card")
        .locator("strong")
        .filter({
          hasText: "Do not normalize repeated avoidance of hard conversations.",
        })
        .first()
    ).toBeVisible();
  });
});'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one final principle assertion, found {text.count(old)}")
          smoke.write_text(text.replace(old, new, 1))
          PY
      - name: Format patched files
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm install --frozen-lockfile
          pnpm exec biome format --write components/judgment-decision.tsx tests/e2e/judgment-loop.test.ts tests/e2e/principles-smoke.test.ts
      - name: Commit contract fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/judgment-decision.tsx tests/e2e/judgment-loop.test.ts tests/e2e/principles-smoke.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "Align M4 browser test contracts"
          git push origin HEAD:${{ github.head_ref }}
