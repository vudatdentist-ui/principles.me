name: Deploy production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Verify release
    runs-on: [self-hosted, linux, x64, principles-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

  deploy:
    name: Deploy to Hostinger VPS
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, principles-ci]
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        shell: bash
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Recover server-owned production config
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ vars.VPS_APP_DIR }}
          BOOTSTRAP_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          BOOTSTRAP_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          VPS_PORT="${VPS_PORT:-22}"
          APP_DIR="${APP_DIR:-/opt/principles-council}"

          LOCAL_BOOTSTRAP="$(mktemp)"
          REMOTE_BOOTSTRAP="/tmp/principles-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
          trap 'rm -f "$LOCAL_BOOTSTRAP"' EXIT
          chmod 600 "$LOCAL_BOOTSTRAP"
          printf 'POSTGRES_URL=%s\n' "$BOOTSTRAP_POSTGRES_URL" > "$LOCAL_BOOTSTRAP"
          printf 'DEEPSEEK_API_KEY=%s\n' "$BOOTSTRAP_DEEPSEEK_API_KEY" >> "$LOCAL_BOOTSTRAP"

          scp -q -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$LOCAL_BOOTSTRAP" "$VPS_USER@$VPS_HOST:$REMOTE_BOOTSTRAP"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' BOOTSTRAP_FILE='$REMOTE_BOOTSTRAP' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          : "${APP_DIR:?APP_DIR is required}"
          : "${BOOTSTRAP_FILE:?BOOTSTRAP_FILE is required}"
          trap 'rm -f "$BOOTSTRAP_FILE"' EXIT
          chmod 600 "$BOOTSTRAP_FILE"

          ENV_FILE="$APP_DIR/.env.production"
          test -f "$ENV_FILE"

          read_env() {
            local name="$1"
            local file="$2"
            sed -n "s/^${name}=//p" "$file" | tail -n 1
          }

          write_env_if_missing() {
            local name="$1"
            local value="$2"
            local file="$3"
            if [ -z "$value" ] || grep -Eq "^${name}=.+$" "$file"; then
              return 1
            fi
            local temp
            temp="$(mktemp)"
            grep -v "^${name}=" "$file" > "$temp" || true
            printf '%s=%s\n' "$name" "$value" >> "$temp"
            cat "$temp" > "$file"
            rm -f "$temp"
            return 0
          }

          if ! grep -Eq '^POSTGRES_URL=.+$' "$ENV_FILE"; then
            DATABASE_URL_VALUE="$(read_env DATABASE_URL "$ENV_FILE")"
            write_env_if_missing POSTGRES_URL "$DATABASE_URL_VALUE" "$ENV_FILE" || true
            unset DATABASE_URL_VALUE
          fi

          CONTAINER_ENV="$(mktemp)"
          trap 'rm -f "$BOOTSTRAP_FILE" "$CONTAINER_ENV"' EXIT
          if docker inspect principles-web >/dev/null 2>&1; then
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' principles-web > "$CONTAINER_ENV"

            if ! grep -Eq '^POSTGRES_URL=.+$' "$ENV_FILE"; then
              POSTGRES_VALUE="$(read_env POSTGRES_URL "$CONTAINER_ENV")"
              if [ -z "$POSTGRES_VALUE" ]; then
                POSTGRES_VALUE="$(read_env DATABASE_URL "$CONTAINER_ENV")"
              fi
              write_env_if_missing POSTGRES_URL "$POSTGRES_VALUE" "$ENV_FILE" || true
              unset POSTGRES_VALUE
            fi

            if ! grep -Eq '^DEEPSEEK_API_KEY=.+$' "$ENV_FILE"; then
              DEEPSEEK_VALUE="$(read_env DEEPSEEK_API_KEY "$CONTAINER_ENV")"
              write_env_if_missing DEEPSEEK_API_KEY "$DEEPSEEK_VALUE" "$ENV_FILE" || true
              unset DEEPSEEK_VALUE
            fi
          fi

          if ! grep -Eq '^POSTGRES_URL=.+$' "$ENV_FILE"; then
            POSTGRES_VALUE="$(read_env POSTGRES_URL "$BOOTSTRAP_FILE")"
            write_env_if_missing POSTGRES_URL "$POSTGRES_VALUE" "$ENV_FILE" || true
            unset POSTGRES_VALUE
          fi

          if ! grep -Eq '^DEEPSEEK_API_KEY=.+$' "$ENV_FILE"; then
            DEEPSEEK_VALUE="$(read_env DEEPSEEK_API_KEY "$BOOTSTRAP_FILE")"
            write_env_if_missing DEEPSEEK_API_KEY "$DEEPSEEK_VALUE" "$ENV_FILE" || true
            unset DEEPSEEK_VALUE
          fi
          REMOTE

      - name: Upload and deploy exact commit to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ vars.VPS_APP_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$DEPLOY_SHA"
          VPS_PORT="${VPS_PORT:-22}"
          APP_DIR="${APP_DIR:-/opt/principles-council}"
          STAGE_DIR="/tmp/principles-council-${DEPLOY_SHA}"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "STAGE_DIR='$STAGE_DIR' bash -s" <<'REMOTE_PREP'
          set -Eeuo pipefail
          rm -rf "$STAGE_DIR"
          install -d "$STAGE_DIR"
          REMOTE_PREP

          git archive --format=tar "$DEPLOY_SHA" | gzip -1 | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
              -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "tar -xzf - -C '$STAGE_DIR'"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' STAGE_DIR='$STAGE_DIR' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          : "${APP_DIR:?APP_DIR is required}"
          : "${STAGE_DIR:?STAGE_DIR is required}"
          : "${DEPLOY_SHA:?DEPLOY_SHA is required}"
          test -f "$STAGE_DIR/scripts/deploy-production-v2.sh"

          install -d "$APP_DIR"
          test -f "$APP_DIR/.env.production"

          # Keep only the server-owned environment file between exact-source releases.
          find "$APP_DIR" -mindepth 1 -maxdepth 1 \
            ! -name '.env.production' -exec rm -rf -- {} +
          cp -a "$STAGE_DIR/." "$APP_DIR/"
          rm -rf "$STAGE_DIR"
          cd "$APP_DIR"

          DEPLOY_SHA="$DEPLOY_SHA" bash scripts/deploy-production-v2.sh
          REMOTE

      - name: Verify deployed V2 release
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          HEALTH_FILE="$(mktemp)"
          trap 'rm -f "$HEALTH_FILE"' EXIT
          export HEALTH_FILE DEPLOY_SHA

          curl --fail-with-body --silent --show-error \
            --retry 15 --retry-delay 4 --retry-all-errors --max-time 20 \
            --output "$HEALTH_FILE" https://principles.me/api/v2/health

          cat "$HEALTH_FILE"
          echo

          node <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync(process.env.HEALTH_FILE, "utf8"));
          if (health.status !== "ok") {
            throw new Error(`V2 health is ${health.status ?? "unknown"}.`);
          }
          if (health.version !== process.env.DEPLOY_SHA) {
            throw new Error(
              `V2 health reports ${health.version ?? "unknown"}, expected ${process.env.DEPLOY_SHA}.`
            );
          }
          NODE

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors --max-time 20 \
            https://principles.me/v2 >/dev/null

      - name: Report production deployment status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "production/deploy",
              description: success
                ? "exact image, DB network, schema and public V2 health verified"
                : "production deployment failed; inspect the linked run",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
