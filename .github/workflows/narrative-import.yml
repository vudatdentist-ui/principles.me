name: Apply verified narrative source
on:
  push:
    branches: [refactor/narrative-evidence-20260923]
    paths: [.github/workflows/narrative-import.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate checksum, baseline and exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          base = 'be9d3a2634acf1b36fe63bd21e9db5f486f43a0d'
          transport = {'.github/narrative-patch.1.b64', '.github/narrative-patch.2.b64', '.github/workflows/narrative-import.yml'}
          before = set(subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines())
          assert before == transport, f'Unexpected branch changes: {before}'
          encoded = ''.join(pathlib.Path(f'.github/narrative-patch.{n}.b64').read_text().strip() for n in [1,2])
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '76e3c7c7151e0e7735f0555dac5b5595be07b764ae7ec7cacbed21b0e462b123', 'Patch checksum mismatch'
          expected = set('''PROJECT_CONTEXT.md
          docs/product/NARRATIVE_WORKSPACE.md
          features/ask/ask-workspace.module.css
          features/ask/ask-workspace.tsx
          features/evolution/__tests__/ui-copy-contract.test.ts
          features/evolution/evolution-memory.tsx
          features/evolution/evolution-step-explorer.tsx
          features/evolution/evolution-workspace.module.css
          features/evolution/evolution-workspace.tsx
          features/i18n/locale.tsx
          features/i18n/narrative-messages.ts
          features/learning/learning-recenter.module.css
          features/learning/learning-recenter.tsx
          features/learning/learning-workspace.tsx
          features/organization/organization-recenter.module.css
          features/organization/organization-recenter.tsx
          scripts/check-ui-contracts.mjs
          tests/e2e/account-data.spec.ts
          tests/e2e/audit-regression.spec.ts
          tests/e2e/evolution-interaction.spec.ts
          tests/e2e/i18n.spec.ts
          tests/e2e/learning-capture.spec.ts
          tests/e2e/learning-editorial.spec.ts
          tests/e2e/narrative-completion.spec.ts
          tests/e2e/narrative-records.spec.ts
          tests/e2e/nested-stage-layout.spec.ts
          tests/e2e/phase5-organization.spec.ts
          tests/e2e/phase6-mobile.spec.ts
          tests/e2e/readability.spec.ts
          tests/e2e/smoke.spec.ts
          tests/e2e/ui-regression.spec.ts'''.splitlines())
          actual = {line.split('\t')[-1] for line in subprocess.check_output(['git','apply','--numstat','-'],input=patch).decode().splitlines()}
          assert actual == expected, f'Unexpected patch scope: {actual ^ expected}'
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm','--',*sorted(transport)],check=True)
          after = set(subprocess.check_output(['git','diff','--cached','--name-only',base]).decode().splitlines())
          assert after == expected, 'Final source scope changed'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Commit source and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(ui): lead narrative chapters with records instead of slogans'
          git push origin HEAD:refs/heads/refactor/narrative-evidence-20260923
          git rev-parse HEAD
