name: Foundation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: foundation-${{ github.head_ref || github.ref_name }}

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, principles-ci]
    env:
      APP_ORIGIN: http://127.0.0.1:3000
      AUTH_SIGNUP_MODE: open
      POSTGRES_DB: principles_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PASSWORD: principles_test
      POSTGRES_PORT: 5432
      POSTGRES_USER: principles
      RAGFLOW_ASSIGN_BOOTSTRAP_DATASETS: "true"
      RAGFLOW_DATASET_IDS: dataset-a,dataset-b
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: principles_test
          POSTGRES_PASSWORD: principles_test
          POSTGRES_USER: principles
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U principles -d principles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Build
        run: pnpm build
