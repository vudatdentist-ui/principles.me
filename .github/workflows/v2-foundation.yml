name: V2 Foundation

on:
  pull_request:
  push:
    branches:
      - main
      - "arch/**"
      - "agent/**"
      - "integration/**"

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: v2-foundation-${{ github.ref }}

jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 20
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify v2 contracts
        run: pnpm contracts:v2
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint foundation scope
        run: pnpm exec biome lint app/v2 features/decision features/evidence features/shared scripts/verify-v2-contracts.ts
      - name: Validate available Wave 1 scopes
        shell: bash
        run: |
          set -euo pipefail
          if [ -d features/evidence/providers ]; then
            pnpm exec biome lint features/evidence/providers
            pnpm exec tsx --test features/evidence/providers/__tests__/*.test.ts
          fi
          if [ -d features/brain ]; then
            pnpm exec biome lint features/brain
            pnpm exec tsx --test features/brain/__tests__/*.test.ts
          fi
          if [ -d lib/ai/providers ]; then
            pnpm exec biome lint lib/ai/providers
            pnpm exec tsx --test lib/ai/providers/__tests__/*.test.ts
          fi
          if [ -d features/shell ]; then
            pnpm exec biome lint features/shell features/ui-v2 styles/v2
          fi
          if [ -d features/decision/persistence ]; then
            pnpm exec biome lint lib/db/schema.ts lib/db/queries features/decision/persistence features/review/persistence
            POSTGRES_URL=postgres://validation:validation@127.0.0.1:5432/principles_validation pnpm db:check
          fi
      - name: Build
        run: pnpm build
