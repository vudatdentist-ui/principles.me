name: Production V2 decision smoke

on:
  push:
    branches:
      - ops/production-db-diagnostics

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-v2-decision-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify live decision stream
    runs-on: [self-hosted, linux, x64, principles-ci]
    timeout-minutes: 5
    steps:
      - name: Execute one live decision request
        id: smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          BODY="$(mktemp)"
          HEADERS="$(mktemp)"
          trap 'rm -f "$BODY" "$HEADERS"' EXIT
          export BODY HEADERS

          STATUS="$(curl --silent --show-error --max-time 120 \
            --dump-header "$HEADERS" --output "$BODY" --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"question":"Should I prioritize finishing the current integration work before adding new features?"}' \
            https://principles.me/api/v2/decisions || true)"
          printf 'HTTP_STATUS=%s\n' "$STATUS"

          CONTENT_TYPE="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); value=$0} END{print value}' "$HEADERS")"
          case "$CONTENT_TYPE" in application/x-ndjson*) NDJSON=1 ;; *) NDJSON=0 ;; esac
          printf 'NDJSON=%s\n' "$NDJSON"

          export HTTP_STATUS="$STATUS"
          export NDJSON
          node <<'NODE'
          const fs = require("node:fs");
          const body = fs.readFileSync(process.env.BODY, "utf8");
          const status = Number(process.env.HTTP_STATUS || 0);
          const ndjson = process.env.NDJSON === "1";
          let types = [];
          let errorCode = "none";
          let retryable = "0";
          let brief = 0;
          let done = 0;

          if (ndjson) {
            for (const line of body.split("\n")) {
              if (!line.trim()) continue;
              try {
                const event = JSON.parse(line);
                if (typeof event?.type === "string") types.push(event.type);
                if (event?.type === "brief") brief += 1;
                if (event?.type === "done") done += 1;
                if (event?.type === "error") {
                  errorCode = String(event.code || "unknown").replace(/[^A-Za-z0-9_.-]/g, "_").slice(0, 60);
                  retryable = event.retryable ? "1" : "0";
                }
              } catch {
                errorCode = "invalid_ndjson";
              }
            }
          } else {
            try {
              const payload = JSON.parse(body);
              if (payload?.error?.code) {
                errorCode = String(payload.error.code).replace(/[^A-Za-z0-9_.-]/g, "_").slice(0, 60);
              }
            } catch {}
          }

          const uniqueTypes = [...new Set(types)].join(",").slice(0, 100) || "none";
          console.log(`EVENT_TYPES=${uniqueTypes}`);
          console.log(`ERROR_CODE=${errorCode}`);
          console.log(`RETRYABLE=${retryable}`);
          console.log(`BRIEF=${brief}`);
          console.log(`DONE=${done}`);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `http_status=${status}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ndjson=${ndjson ? 1 : 0}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `event_types=${uniqueTypes}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `error_code=${errorCode}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `retryable=${retryable}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `brief=${brief}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `done=${done}\n`);

          if (status !== 200 || !ndjson || errorCode !== "none" || brief !== 1 || done !== 1) {
            process.exit(1);
          }
          NODE

      - name: Publish smoke status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          HTTP: ${{ steps.smoke.outputs.http_status || '0' }}
          NDJSON: ${{ steps.smoke.outputs.ndjson || '0' }}
          TYPES: ${{ steps.smoke.outputs.event_types || 'none' }}
          ERROR_CODE: ${{ steps.smoke.outputs.error_code || 'unknown' }}
          BRIEF: ${{ steps.smoke.outputs.brief || '0' }}
          DONE: ${{ steps.smoke.outputs.done || '0' }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "production/v2-decision-smoke",
              description: `http=${process.env.HTTP} ndjson=${process.env.NDJSON} types=${process.env.TYPES} err=${process.env.ERROR_CODE} brief=${process.env.BRIEF} done=${process.env.DONE}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
