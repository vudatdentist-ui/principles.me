name: Production app image repair

on:
  push:
    branches:
      - ops/production-db-diagnostics

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-app-image-repair
  cancel-in-progress: true

jobs:
  repair:
    name: Recreate production app from latest image
    runs-on: [self-hosted, linux, x64, principles-ci]
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        shell: bash
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Force recreate application container
        id: repair
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ vars.VPS_APP_DIR }}
          TARGET_SHA: 6cfd4ace168343b21fa45fa74ecdd955d950f739
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          VPS_PORT="${VPS_PORT:-22}"
          APP_DIR="${APP_DIR:-/opt/principles-council}"
          REPORT="$(mktemp)"
          trap 'rm -f "$REPORT"' EXIT

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' TARGET_SHA='$TARGET_SHA' bash -s" > "$REPORT" <<'REMOTE'
          set -Eeuo pipefail
          : "${APP_DIR:?APP_DIR is required}"
          : "${TARGET_SHA:?TARGET_SHA is required}"
          cd "$APP_DIR"
          test -f .env.production
          test -f docker-compose.hostinger.yml

          DB_NETWORK="$(sed -n 's/^PRINCIPLES_DB_NETWORK=//p' .env.production | tail -n 1)"
          case "$DB_NETWORK" in
            ''|*[!A-Za-z0-9_.-]*) echo 'PRINCIPLES_DB_NETWORK is missing or invalid.' >&2; exit 1 ;;
          esac
          docker network inspect "$DB_NETWORK" >/dev/null
          docker network inspect coolify >/dev/null

          if ! docker run --rm --entrypoint sh principles-council-principles:latest -lc \
            "find .next -type f -path '*api/v2/health*' -print -quit | grep -q ."; then
            echo 'Latest image does not contain the V2 health artifact; refusing recreation.' >&2
            exit 1
          fi

          OVERRIDE_FILE="$(mktemp)"
          trap 'rm -f "$OVERRIDE_FILE"' EXIT
          cat > "$OVERRIDE_FILE" <<EOF_OVERRIDE
          services:
            principles:
              networks:
                - coolify
                - principles-db
          networks:
            principles-db:
              external: true
              name: "$DB_NETWORK"
          EOF_OVERRIDE

          APP_VERSION="$TARGET_SHA" \
            docker compose -f docker-compose.hostinger.yml -f "$OVERRIDE_FILE" \
              up -d --no-build --force-recreate --remove-orphans principles

          test "$(docker inspect -f '{{.State.Running}}' principles-web)" = 'true'

          RUNNING_IMAGE_ID="$(docker inspect -f '{{.Image}}' principles-web)"
          LATEST_IMAGE_ID="$(docker image inspect -f '{{.Id}}' principles-council-principles:latest)"
          if [ "$RUNNING_IMAGE_ID" != "$LATEST_IMAGE_ID" ]; then
            echo 'Recreated container is not using the latest image.' >&2
            exit 1
          fi

          APP_VERSION="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' principles-web | sed -n 's/^APP_VERSION=//p' | tail -n 1)"
          if [ "$APP_VERSION" != "$TARGET_SHA" ]; then
            echo 'Recreated container does not report the target APP_VERSION.' >&2
            exit 1
          fi

          APP_NETWORKS=" $(docker inspect -f '{{range $net, $cfg := .NetworkSettings.Networks}}{{$net}} {{end}}' principles-web) "
          case "$APP_NETWORKS" in *" coolify "*) ;; *) echo 'Missing coolify network.' >&2; exit 1 ;; esac
          case "$APP_NETWORKS" in *" $DB_NETWORK "*) ;; *) echo 'Missing DB network.' >&2; exit 1 ;; esac

          HEALTH_STATUS=0
          HEALTH_OK=0
          for attempt in $(seq 1 20); do
            RESULT="$(docker exec principles-web node -e '
              fetch("http://127.0.0.1:3000/api/v2/health", { cache: "no-store" })
                .then(async r => { let p=null; try { p=await r.json(); } catch {} console.log(`STATUS=${r.status}`); console.log(`OK=${r.ok && p?.status === "ok" ? 1 : 0}`); })
                .catch(() => { console.log("STATUS=0"); console.log("OK=0"); });
            ' 2>/dev/null || true)"
            HEALTH_STATUS="$(printf '%s\n' "$RESULT" | sed -n 's/^STATUS=//p' | tail -n 1)"
            HEALTH_OK="$(printf '%s\n' "$RESULT" | sed -n 's/^OK=//p' | tail -n 1)"
            HEALTH_STATUS="${HEALTH_STATUS:-0}"
            HEALTH_OK="${HEALTH_OK:-0}"
            if [ "$HEALTH_STATUS" = '200' ] && [ "$HEALTH_OK" = '1' ]; then break; fi
            sleep 2
          done
          if [ "$HEALTH_STATUS" != '200' ] || [ "$HEALTH_OK" != '1' ]; then
            echo "Internal V2 health is not ready (HTTP $HEALTH_STATUS)." >&2
            exit 1
          fi

          printf 'IMAGE_MATCH=1\n'
          printf 'VERSION_MATCH=1\n'
          printf 'NETWORKS_READY=1\n'
          printf 'INTERNAL_HEALTH=1\n'
          REMOTE

          cat "$REPORT"
          while IFS='=' read -r key value; do
            case "$key" in
              IMAGE_MATCH) echo "image_match=$value" >> "$GITHUB_OUTPUT" ;;
              VERSION_MATCH) echo "version_match=$value" >> "$GITHUB_OUTPUT" ;;
              NETWORKS_READY) echo "networks_ready=$value" >> "$GITHUB_OUTPUT" ;;
              INTERNAL_HEALTH) echo "internal_health=$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < "$REPORT"

      - name: Check public V2 health
        id: public
        shell: bash
        run: |
          set -Eeuo pipefail
          STATUS="$(curl --silent --show-error --max-time 20 -o /tmp/principles-health.$$ -w '%{http_code}' https://principles.me/api/v2/health || true)"
          trap 'rm -f /tmp/principles-health.$$' EXIT
          printf 'PUBLIC_STATUS=%s\n' "$STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Publish repair status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          IMAGE: ${{ steps.repair.outputs.image_match || '0' }}
          VERSION: ${{ steps.repair.outputs.version_match || '0' }}
          NETWORKS: ${{ steps.repair.outputs.networks_ready || '0' }}
          INTERNAL: ${{ steps.repair.outputs.internal_health || '0' }}
          PUBLIC_STATUS: ${{ steps.public.outputs.status || '0' }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? "success" : "failure",
              context: "production/image-repair",
              description: `image=${process.env.IMAGE} ver=${process.env.VERSION} nets=${process.env.NETWORKS} internal=${process.env.INTERNAL} public=${process.env.PUBLIC_STATUS}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
