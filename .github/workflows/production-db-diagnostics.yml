name: Production duplicate router diagnostics

on:
  push:
    branches:
      - ops/production-db-diagnostics

permissions:
  contents: read

concurrency:
  group: production-duplicate-router-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Inspect duplicate domain claimers
    runs-on: [self-hosted, linux, x64, principles-ci]
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        shell: bash
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect domain claimers
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          count=0
          while IFS= read -r cid; do
            [ -n "$cid" ] || continue
            labels="$(docker inspect -f '{{range $k, $v := .Config.Labels}}{{$k}}={{$v}}{{"\n"}}{{end}}' "$cid" 2>/dev/null || true)"
            printf '%s\n' "$labels" | grep -Fq 'principles.me' || continue
            count=$((count + 1))
            name="$(docker inspect -f '{{.Name}}' "$cid" | sed 's#^/##')"
            image="$(docker inspect -f '{{.Config.Image}}' "$cid")"
            created="$(docker inspect -f '{{.Created}}' "$cid" | cut -c1-19)"
            running="$(docker inspect -f '{{.State.Running}}' "$cid")"
            project="$(printf '%s\n' "$labels" | sed -n 's/^com.docker.compose.project=//p' | tail -n 1)"
            service="$(printf '%s\n' "$labels" | sed -n 's/^com.docker.compose.service=//p' | tail -n 1)"
            networks="$(docker inspect -f '{{range $net, $cfg := .NetworkSettings.Networks}}{{$net}},{{end}}' "$cid")"
            printf 'CLAIMER_%s name=%s image=%s created=%s running=%s project=%s service=%s networks=%s\n' \
              "$count" "$name" "$image" "$created" "$running" "${project:-none}" "${service:-none}" "$networks"
          done <<EOF_CONTAINERS
          $(docker ps -aq)
          EOF_CONTAINERS
          printf 'CLAIMER_COUNT=%s\n' "$count"
          REMOTE
