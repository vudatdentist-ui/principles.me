name: Production duplicate router diagnostics

on:
  push:
    branches:
      - ops/production-db-diagnostics

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-duplicate-router-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Inspect duplicate domain claimers
    runs-on: [self-hosted, linux, x64, principles-ci]
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        shell: bash
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect domain claimers
        id: inspect
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          REPORT="$(mktemp)"
          trap 'rm -f "$REPORT"' EXIT
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s > "$REPORT" <<'REMOTE'
          set -Eeuo pipefail
          count=0
          other_name=none
          other_image=none
          other_project=none
          other_service=none
          other_running=false
          while IFS= read -r cid; do
            [ -n "$cid" ] || continue
            labels="$(docker inspect -f '{{range $k, $v := .Config.Labels}}{{$k}}={{$v}}{{"\n"}}{{end}}' "$cid" 2>/dev/null || true)"
            printf '%s\n' "$labels" | grep -Fq 'principles.me' || continue
            count=$((count + 1))
            name="$(docker inspect -f '{{.Name}}' "$cid" | sed 's#^/##')"
            if [ "$name" != 'principles-web' ]; then
              other_name="$name"
              other_image="$(docker inspect -f '{{.Config.Image}}' "$cid")"
              other_project="$(printf '%s\n' "$labels" | sed -n 's/^com.docker.compose.project=//p' | tail -n 1)"
              other_service="$(printf '%s\n' "$labels" | sed -n 's/^com.docker.compose.service=//p' | tail -n 1)"
              other_running="$(docker inspect -f '{{.State.Running}}' "$cid")"
            fi
          done <<EOF_CONTAINERS
          $(docker ps -aq)
          EOF_CONTAINERS
          clean() { printf '%s' "$1" | tr -cd 'A-Za-z0-9_.:/@+-' | cut -c1-80; }
          printf 'COUNT=%s\n' "$count"
          printf 'OTHER_NAME=%s\n' "$(clean "$other_name")"
          printf 'OTHER_IMAGE=%s\n' "$(clean "$other_image")"
          printf 'OTHER_PROJECT=%s\n' "$(clean "${other_project:-none}")"
          printf 'OTHER_SERVICE=%s\n' "$(clean "${other_service:-none}")"
          printf 'OTHER_RUNNING=%s\n' "$other_running"
          REMOTE

          cat "$REPORT"
          while IFS='=' read -r key value; do
            case "$key" in
              COUNT) echo "count=$value" >> "$GITHUB_OUTPUT" ;;
              OTHER_NAME) echo "other_name=$value" >> "$GITHUB_OUTPUT" ;;
              OTHER_IMAGE) echo "other_image=$value" >> "$GITHUB_OUTPUT" ;;
              OTHER_PROJECT) echo "other_project=$value" >> "$GITHUB_OUTPUT" ;;
              OTHER_SERVICE) echo "other_service=$value" >> "$GITHUB_OUTPUT" ;;
              OTHER_RUNNING) echo "other_running=$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < "$REPORT"

      - name: Publish sanitized router identity
        if: always()
        uses: actions/github-script@v7
        env:
          COUNT: ${{ steps.inspect.outputs.count || '0' }}
          OTHER_NAME: ${{ steps.inspect.outputs.other_name || 'none' }}
          OTHER_IMAGE: ${{ steps.inspect.outputs.other_image || 'none' }}
          OTHER_PROJECT: ${{ steps.inspect.outputs.other_project || 'none' }}
          OTHER_SERVICE: ${{ steps.inspect.outputs.other_service || 'none' }}
          OTHER_RUNNING: ${{ steps.inspect.outputs.other_running || 'false' }}
        with:
          script: |
            const description = `count=${process.env.COUNT} other=${process.env.OTHER_NAME} image=${process.env.OTHER_IMAGE} project=${process.env.OTHER_PROJECT} service=${process.env.OTHER_SERVICE} running=${process.env.OTHER_RUNNING}`.slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "production/router-identity",
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
