name: Legacy oracle route diagnostics

on:
  push:
    branches:
      - ops/production-db-diagnostics

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-oracle-route-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Inspect oracle-ui routing
    runs-on: [self-hosted, linux, x64, principles-ci]
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        shell: bash
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect oracle-ui labels
        id: inspect
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          REPORT="$(mktemp)"
          trap 'rm -f "$REPORT"' EXIT
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s > "$REPORT" <<'REMOTE'
          set -Eeuo pipefail
          if ! docker inspect oracle-ui >/dev/null 2>&1; then
            printf 'EXISTS=0\nPRINCIPLES_RULES=0\nOTHER_HOST_RULES=0\nON_COOLIFY=0\n'
            exit 0
          fi
          labels="$(docker inspect -f '{{range $k, $v := .Config.Labels}}{{$k}}={{$v}}{{"\n"}}{{end}}' oracle-ui)"
          rules="$(printf '%s\n' "$labels" | grep -E '^traefik\.http\.routers\..*\.rule=' || true)"
          principles_rules="$(printf '%s\n' "$rules" | grep -Fc 'principles.me' || true)"
          other_host_rules="$(printf '%s\n' "$rules" | grep -vF 'principles.me' | grep -Fc 'Host(' || true)"
          on_coolify=0
          if docker inspect -f '{{range $net, $cfg := .NetworkSettings.Networks}}{{$net}}{{"\n"}}{{end}}' oracle-ui | grep -Fxq coolify; then on_coolify=1; fi
          printf 'EXISTS=1\n'
          printf 'PRINCIPLES_RULES=%s\n' "$principles_rules"
          printf 'OTHER_HOST_RULES=%s\n' "$other_host_rules"
          printf 'ON_COOLIFY=%s\n' "$on_coolify"
          printf '%s\n' "$rules" | sed -E 's/[[:space:]]+/ /g' | cut -c1-240
          REMOTE
          cat "$REPORT"
          while IFS='=' read -r key value; do
            case "$key" in
              EXISTS) echo "exists=$value" >> "$GITHUB_OUTPUT" ;;
              PRINCIPLES_RULES) echo "principles_rules=$value" >> "$GITHUB_OUTPUT" ;;
              OTHER_HOST_RULES) echo "other_host_rules=$value" >> "$GITHUB_OUTPUT" ;;
              ON_COOLIFY) echo "on_coolify=$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < "$REPORT"

      - name: Publish sanitized routing summary
        if: always()
        uses: actions/github-script@v7
        env:
          EXISTS: ${{ steps.inspect.outputs.exists || '0' }}
          PRINCIPLES_RULES: ${{ steps.inspect.outputs.principles_rules || '0' }}
          OTHER_HOST_RULES: ${{ steps.inspect.outputs.other_host_rules || '0' }}
          ON_COOLIFY: ${{ steps.inspect.outputs.on_coolify || '0' }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "production/oracle-routing",
              description: `exists=${process.env.EXISTS} principlesRules=${process.env.PRINCIPLES_RULES} otherHostRules=${process.env.OTHER_HOST_RULES} coolify=${process.env.ON_COOLIFY}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
