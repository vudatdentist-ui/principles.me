name: Fix v1 whitespace

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'release/v1.0.0'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Normalize suppression spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in [
              'components/ask-thinking-session.tsx',
              'components/goals/goals-workspace.tsx',
              'components/decision-detail-v1.tsx',
          ]:
              p = Path(filename)
              text = p.read_text().replace('"use client";\n\n\n', '"use client";\n\n')
              p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          HUSKY=0 git commit -m "Normalize v1 UI suppression spacing"
          git push origin HEAD:${{ github.head_ref }}
