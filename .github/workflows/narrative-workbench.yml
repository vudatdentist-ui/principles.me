name: Narrative source import
on:
  push:
    branches: [workbench/narrative-evidence-20260923]
    paths: [.narrative/ready]
permissions:
  contents: write
concurrency:
  group: narrative-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: be9d3a2634acf1b36fe63bd21e9db5f486f43a0d
      - name: Verify the reviewed patch and exact resulting source tree
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = be9d3a2634acf1b36fe63bd21e9db5f486f43a0d
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          chunks = sorted(pathlib.Path('../packet/.narrative').glob('patch-*.b64'))
          assert len(chunks) == 4
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0967143b347a68e5cfc54d5fc1f2afcf07921a71a3e3f95a8594e45734f57a6f'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', 'app', 'docs', 'features', 'scripts', 'tests'], check=True)
          assert subprocess.check_output(['git', 'write-tree']).decode().strip() == '4b9a2be16a7a251ce92810c270fdd129b4918755'
          PY
          git diff --cached --check
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git switch -c refactor/narrative-working-chapters
          git commit -m 'refactor(ui): replace stock slogans with record-led narrative chapters'
          git push origin HEAD:refs/heads/refactor/narrative-working-chapters
          git rev-parse HEAD > ../receipt.txt
          git rev-parse HEAD^{tree} >> ../receipt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: narrative-import-receipt
          path: receipt.txt
          retention-days: 2
