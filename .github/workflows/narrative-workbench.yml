name: Narrative workbench
on:
  push:
    branches: [workbench/narrative-evidence-20260923]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be9d3a2634acf1b36fe63bd21e9db5f486f43a0d
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Source and dependencies without credentials or user data
        run: |
          mkdir -p workbench
          git archive --format=tar HEAD | gzip > workbench/source.tar.gz
          git rev-parse HEAD > workbench/source-sha.txt
          git ls-tree -r HEAD > workbench/source-tree.txt
          tar -czf workbench/dependencies.tar.gz node_modules
      - name: Isolated PostgreSQL runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          mkdir -p workbench/pg/lib
          cp -a /usr/lib/postgresql/16/bin workbench/pg/bin
          cp -a /usr/lib/postgresql/16/lib workbench/pg/pg-lib
          cp -a /usr/share/postgresql/16 workbench/pg/share
          ldd /usr/lib/postgresql/16/bin/* /usr/lib/postgresql/16/lib/*.so 2>/dev/null | awk '/=> \// {print $3}' | sort -u | while read -r lib; do
            case "$(basename "$lib")" in libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*) continue;; esac
            cp -L "$lib" workbench/pg/lib/
          done
          tar -czf workbench/postgres.tar.gz -C workbench pg
          rm -rf workbench/pg
      - run: pnpm exec playwright install --with-deps chromium
      - name: Inspect the requested public narrative reference
        continue-on-error: true
        run: |
          mkdir -p workbench/reference
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('node:fs/promises');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('https://learn.w4gz.com/', {waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(3000);
            await page.screenshot({path:'workbench/reference/00-top.png'});
            await fs.writeFile('workbench/reference/page.txt', await page.locator('body').innerText());
            await fs.writeFile('workbench/reference/links.json', JSON.stringify(await page.locator('a,button').evaluateAll(nodes=>nodes.map(n=>({text:n.textContent,href:n.getAttribute('href')}))), null, 2));
            for (let i=1;i<=4;i++) {
              await page.mouse.wheel(0,900);
              await page.waitForTimeout(1800);
              await page.screenshot({path:`workbench/reference/0${i}-chapter.png`});
            }
            await browser.close();
          })().catch(error=>{console.error(error.message);process.exit(1)});
          NODE
      - name: Checksums
        run: cd workbench && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: narrative-workbench
          path: workbench
          compression-level: 0
          retention-days: 2
