name: Narrative browser correction import
on:
  push:
    branches: [workbench/narrative-evidence-20260923]
    paths: [.narrative/browser-fix.patch]
permissions:
  contents: write
concurrency:
  group: narrative-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: 6691fa4584ceed6ed12c69af74d81ae018507b08
      - name: Verify browser corrections and exact source tree
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/refactor/narrative-working-chapters | cut -f1)" = 6691fa4584ceed6ed12c69af74d81ae018507b08
          python3 <<'PY'
          import hashlib, pathlib, subprocess
          patch = pathlib.Path('../packet/.narrative/browser-fix.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == '797a2e518046e329f0ca43dd011303fcea9a520dabe51ee42d7c3f9f59bc296a'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'add', 'features/evolution/evolution-workspace.module.css', 'tests/e2e/narrative-records.spec.ts', 'tests/e2e/smoke.spec.ts'], check=True)
          assert subprocess.check_output(['git', 'write-tree']).decode().strip() == '10e2921cc0df8b4879d5f1ff8852c151adaf8916'
          PY
          git diff --cached --check
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix(ui): keep current work above the fold and verify reviewed proposals'
          git push origin HEAD:refs/heads/refactor/narrative-working-chapters
          git rev-parse HEAD > ../receipt.txt
          git rev-parse HEAD^{tree} >> ../receipt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: narrative-browser-fix-receipt
          path: receipt.txt
          retention-days: 2
