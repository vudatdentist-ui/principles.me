name: Production DB Backup

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: vars.PRODUCTION_BACKUP_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create and verify backup
        env:
          POSTGRES_URL: ${{ secrets.PRODUCTION_POSTGRES_URL }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p backup
          pg_dump --format=custom --no-owner --no-acl "$POSTGRES_URL" > "backup/principles-$stamp.dump"
          pg_restore --list "backup/principles-$stamp.dump" > "backup/principles-$stamp.list"
          sha256sum "backup/principles-$stamp.dump" > "backup/principles-$stamp.sha256"
          printf '%s\n' "$stamp" > backup/created-at.txt
      - name: Upload encrypted-at-rest Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
