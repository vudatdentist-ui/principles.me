name: Refresh reset lockfile

on:
  push:
    branches:
      - reset/personal-business-platform-context

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: [self-hosted, linux, x64, principles-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile for reset dependency graph
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Refresh lockfile for product reset"
          git push origin "HEAD:${GITHUB_REF_NAME}"
