services:
  principles:
    image: ${PRINCIPLES_IMAGE:?PRINCIPLES_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${PRINCIPLES_ENV_FILE:?PRINCIPLES_ENV_FILE is required}
    environment:
      APP_ENV: production
      APP_VERSION: ${PRINCIPLES_IMAGE_TAG:?PRINCIPLES_IMAGE_TAG is required}
      INTERNAL_AUTH_REQUIRED: "true"
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.${TRAEFIK_ROUTER:?TRAEFIK_ROUTER is required}.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER}.rule=Host(`${PRINCIPLES_HOST:?PRINCIPLES_HOST is required}`)
      - traefik.http.routers.${TRAEFIK_ROUTER}.tls=true
      - traefik.http.routers.${TRAEFIK_ROUTER}.tls.certresolver=letsencrypt
      - traefik.http.routers.${TRAEFIK_ROUTER}.service=${TRAEFIK_ROUTER}
      - traefik.http.services.${TRAEFIK_ROUTER}.loadbalancer.server.port=3000

networks:
  coolify:
    external: true
